name: CI Build Pipeline
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Lint code with flake8
        run: flake8 .
      
      - name: Lint code with pylint
        run: pylint server/
      
      - name: Run unit tests with nosetests
        run: nosetests
